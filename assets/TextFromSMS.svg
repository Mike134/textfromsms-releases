<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E88E5"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Source: SMS chat bubble (upper left) -->
  <g filter="url(#shadow)">
    <path d="M190 150 H520 a60 60 0 0 1 60 60 V380 a60 60 0 0 1 -60 60 H300
             L210 520 L228 440 H190 a60 60 0 0 1 -60 -60 V210 a60 60 0 0 1 60 -60 Z"
          fill="#FFFFFF"/>
  </g>
  <text x="355" y="330" text-anchor="middle"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="800" fill="#1565C0" letter-spacing="4">SMS</text>

  <!-- Extraction arrow -->
  <path d="M640 260 C760 270 820 340 828 440" fill="none" stroke="#FFC107"
        stroke-width="44" stroke-linecap="round"/>
  <path d="M760 420 L828 520 L896 420 Z" fill="#FFC107" stroke="#FFC107"
        stroke-width="16" stroke-linejoin="round"/>

  <!-- Result: text document (lower right) -->
  <g filter="url(#shadow)">
    <path d="M430 560 H760 L860 660 V880 a40 40 0 0 1 -40 40 H430 a40 40 0 0 1 -40 -40 V600 a40 40 0 0 1 40 -40 Z"
          fill="#FFFFFF"/>
    <path d="M760 560 V620 a40 40 0 0 0 40 40 H860 Z" fill="#BBDEFB"/>
  </g>
  <rect x="450" y="640" width="250" height="30" rx="15" fill="#1E88E5"/>
  <rect x="450" y="700" width="350" height="30" rx="15" fill="#42A5F5"/>
  <rect x="450" y="760" width="350" height="30" rx="15" fill="#42A5F5"/>
  <rect x="450" y="820" width="220" height="30" rx="15" fill="#90CAF9"/>
</svg>
